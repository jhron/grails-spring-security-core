plugins {
    id 'java-library'
    id 'org.apache.grails.gradle.grails-gsp'
    id 'org.apache.grails.gradle.grails-plugin'
}

group = 'org.apache.grails'

ext {
    publishArtifactId = 'grails-spring-security-acl'
    pomTitle = 'Grails Spring Security ACL Plugin'
    pomDescription = 'Adds Spring Security ACL support to a Grails application.'
    pomDevelopers = ['burtbeckwith': 'Burt Beckwith']
}

grails {
    springDependencyManagement = false
}

dependencies {

    implementation platform("org.apache.grails:grails-bom:$grailsVersion")

    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.apache.grails:grails-core"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.apache.grails:grails-web-boot"
    implementation "org.apache.grails:grails-logging"
    implementation "org.apache.grails:grails-rest-transforms"
    implementation "org.apache.grails:grails-databinding"
    implementation "org.apache.grails:grails-services"
    implementation "org.apache.grails:grails-url-mappings"
    implementation "org.apache.grails:grails-interceptors"
    implementation "org.apache.grails:grails-gsp"
    implementation "org.apache.grails:grails-layout"
    console "org.apache.grails:grails-console"
    profile "org.apache.grails.profiles:web-plugin"
    runtimeOnly "org.apache.grails:grails-services"
    runtimeOnly "org.apache.grails:grails-domain-class"
    testImplementation "org.apache.grails:grails-testing-support-datamapping"
    testImplementation "org.apache.grails:grails-testing-support-web"

    implementation 'org.ehcache:ehcache', {
        capabilities {
            requireCapability('org.ehcache:ehcache-jakarta')
        }
    }

    api project(':core-plugin')
    api 'org.springframework.security:spring-security-acl'
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/plugin-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/java-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/groovydoc-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/publish-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/reproducible-config.gradle')
}

// BSA Nexus publishing — for development/testing only, remove before upstream PR
def bsaMavenReleaseUrl = project.findProperty('mavenReleaseUrl') ?: 'https://sirius.bsa-soft.cz/nexus/content/repositories/releases/'
def bsaMavenSnapshotUrl = project.findProperty('mavenSnapshotUrl') ?: 'https://sirius.bsa-soft.cz/nexus/content/repositories/snapshots/'
def bsaMavenRepositoryUrl = version.toString().endsWith('-SNAPSHOT') ? bsaMavenSnapshotUrl : bsaMavenReleaseUrl
def bsaMavenUsername = project.findProperty('mavenUser') ?: System.getenv('MAVEN_USER')
def bsaMavenPassword = project.findProperty('mavenPassword') ?: System.getenv('MAVEN_PASSWORD')

publishing {
    repositories {
        maven {
            name = 'bsaNexus'
            url = uri(bsaMavenRepositoryUrl)
            if (bsaMavenUsername && bsaMavenPassword) {
                credentials {
                    username = bsaMavenUsername
                    password = bsaMavenPassword
                }
            }
        }
    }
}

tasks.matching { it.name == 'publishMavenPublicationToBsaNexusRepository' }.configureEach {
    doFirst {
        if (!bsaMavenUsername || !bsaMavenPassword) {
            throw new GradleException('Missing Maven repository credentials. Define mavenUser/mavenPassword Gradle properties or MAVEN_USER/MAVEN_PASSWORD environment variables.')
        }
    }
}
